name: Build and Release Android App

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'release'
        type: choice
        options:
        - debug
        - release
      tag_name:
        description: 'Tag name (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_JSON }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
      
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5
        
    - name: Build Debug APK
      if: github.event.inputs.release_type != 'release'
      run: gradle assembleDebug
      
    - name: Build Release APK
      if: github.event.inputs.release_type == 'release'
      run: |
        gradle assembleRelease
        gradle bundleRelease
      
    - name: Upload Debug APK
      if: github.event.inputs.release_type != 'release'
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
    - name: Upload Release APK
      if: github.event.inputs.release_type == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/bundle/release/app-release.aab

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    
    steps:
    - name: Download Release APK
      if: github.event.inputs.release_type == 'release' || startsWith(github.ref, 'refs/tags/')
      uses: actions/download-artifact@v4
      with:
        name: release-apk
        path: artifacts/
        
    - name: Create Release
      if: github.event.inputs.release_type == 'release' || startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
        name: Bridge ${{ github.event.inputs.tag_name || github.ref_name }}
        body: |
          ## Bridge ${{ github.event.inputs.tag_name || github.ref_name }}
          
          Bridge is a modern chat application for local device communication.
          
          ### Installation
          Download the APK file below and install on your Android device.
          
          ### Usage
          Connect to a WiFi network to discover and communicate with other users.
          
          ### Features
          - Modern Persian interface
          - Smooth chat experience
          - Material Design 3
          - Local network communication
          
          ### Technical Details
          - Built with Java
          - Android SDK 34
          - Material Design 3
          - RTL support
          
          ### Support
          For technical support or feature requests, please refer to the project documentation.
        draft: false
        prerelease: false
        files: artifacts/*
        
    - name: Upload to Google Play (Optional)
      if: env.GOOGLE_PLAY_JSON != ''
      run: |
        echo "Google Play credentials found, would upload to Play Store"
        # Add Google Play upload steps here if needed
      continue-on-error: true