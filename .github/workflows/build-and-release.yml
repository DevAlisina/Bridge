name: Build and Release Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_JSON }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
      
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5
        
    - name: Build Debug APK
      run: gradle assembleDebug
      
    - name: Rename Debug APK
      run: |
        BUILD_NUMBER=$(printf "%05d" "${{ github.run_number }}")
        cp app/build/outputs/apk/debug/app-debug.apk "Bridge-debug-${BUILD_NUMBER}.apk"
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          Bridge-debug-${{ github.run_number }}.apk

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download Debug APK
      uses: actions/download-artifact@v4
      with:
        name: debug-apk
        path: artifacts/
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Bridge Build ${{ github.run_number }}
        body: |
          ## Bridge Build ${{ github.run_number }}
          
          Automated build from commit ${{ github.sha }}.
          
          ### Bridge App
          Bridge is a modern chat application for local device communication.
          
          ### Installation
          Download the APK file below and install on your Android device.
          
          ### Usage
          Connect to a WiFi network to discover and communicate with other users.
          
          ### Features
          - Modern Persian interface
          - Smooth chat experience
          - Material Design 3
          - Local network communication
          
          ### Technical Details
          - Built with Java
          - Android SDK 34
          - Material Design 3
          - RTL support
          - Debug build (auto-uploaded on every push)
          
          ### Support
          For technical support or feature requests, please refer to the project documentation.
          
          ---
          
          **Build Information:**
          - Build Number: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref }}
          - Timestamp: ${{ github.event.created_at }}
        draft: false
        prerelease: true
        files: |
          artifacts/app/build/outputs/apk/debug/app-debug.apk
          artifacts/Bridge-debug-${{ github.run_number }}.apk
        
    - name: Upload to Google Play (Optional)
      if: env.GOOGLE_PLAY_JSON != ''
      run: |
        echo "Google Play credentials found, would upload to Play Store"
        # Add Google Play upload steps here if needed
      continue-on-error: true